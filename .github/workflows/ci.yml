name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate

  panel:
    name: Control panel build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/ui/package-lock.json
      - run: npm ci
      - run: npm run build
