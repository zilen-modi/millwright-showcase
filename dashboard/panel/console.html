  <link rel="stylesheet" href="/panel.css" />
</head>
<body>
  <header>
    <h1>Millwright <span class="tag">· control panel</span></h1>
    <nav>
      <a href="/" class="active">Console</a>
      <a href="/board">Board</a>
      <a href="/cost">Cost</a>
      <a href="/pr-review">Review</a>
    </nav>
    <span class="spacer"></span>
    <span class="live" id="live"><span class="dot"></span><span id="live-label">connecting…</span></span>
    <a class="icon-btn" href="/config" title="Config" aria-label="Config"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>
  </header>

  <div class="wrap console">
    <div class="launcher">
      <p class="launcher-title">Start work on a ticket</p>
      <div class="launcher-row">
        <input id="tkt-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Paste a ticket key (PROJ-1234) or a Jira URL…" />
        <div class="seg" id="mode-seg">
          <button data-mode="plan" class="active">Plan</button>
          <button data-mode="review">Review</button>
        </div>
        <button id="start-btn" class="primary">Start</button>
      </div>
      <div class="launcher-err" id="tkt-err" hidden></div>
    </div>

    <div class="autobar" id="autobar"></div>

    <section class="obs">
      <div class="sec-head"><h2>Runs</h2><span class="sec-sub" id="runs-sub"></span></div>
      <div id="runs" class="runs"></div>
    </section>

    <section class="loggers" id="loggers">
      <div class="sec-head">
        <h2>Logger</h2>
        <span class="sec-sub" id="log-focus">— select a run —</span>
        <span class="spacer"></span>
        <div class="seg logtabs" id="log-tabs">
          <button data-tab="log" class="active">Live log</button>
          <button data-tab="events">Events</button>
        </div>
      </div>
      <div id="log-pane" class="logpane"><div class="muted pad">Select a run above to stream its log here.</div></div>
    </section>
  </div>
  <script src="/console.js"></script>
</body>
</html>
