  <script>
    // Apply the stored theme before first paint so an explicit choice never flashes the
    // OS preference. Mirrors panel.css: no attribute = follow prefers-color-scheme.
    try {
      var t = localStorage.getItem('autopilot.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* private mode — fall back to the OS preference */ }
  </script>
